<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Login | What To Watch</title>
</head>
<body>
    <header class="simple-header"><a class="brand-link" href="{{ url_for('home') }}">What To Watch</a></header>
    <main class="auth-page">
        <section class="auth-panel">
            <p class="media-type">YOUR ACCOUNT</p>
            <h1>Log in</h1>
            {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
            <form method="post" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Log in</button>
            </form>
            <p>New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
        </section>
    </main>
</body>
</html>
